name: Release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis --config src/tauri.conf.json
          tagName: app-v__VERSION__
          releaseName: vibeclicker v__VERSION__
          releaseAssetNamePattern: '[name][setup][ext]'
          releaseBody: |
            ## What's Changed

            - Fixed continuous mode input detection and removed the ~147 CPS bottleneck using on-demand low-level hooks with injected-event filtering and `MsgWaitForMultipleObjects`
            - Added high-resolution Windows timer (`timeBeginPeriod(1)`), 2 ms spin-wait scheduling, lock-free physical input tracking, and batched multi-button `SendInput`
            - Improved portrait/landscape window height bounds and resizing behavior

            **Full Changelog**: https://github.com/zualo/vibeclicker/compare/app-v0.3.2...app-v0.3.3
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
