name: Release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles nsis --config src/tauri.conf.json
          tagName: app-v__VERSION__
          releaseName: vibeclicker v__VERSION__
          releaseAssetNamePattern: '[name][setup][ext]'
          releaseBody: |
            ## What's Changed

            * Release 0.3.1 by @zualo in https://github.com/zualo/vibeclicker/pull/3

            - Compact settings and spacing
            - Content-based portrait sizing
            - Shorter landscape hotkey card

            **Full Changelog**: https://github.com/zualo/vibeclicker/compare/app-v0.3.0...app-v0.3.1
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
